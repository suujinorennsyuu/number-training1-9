<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8ea">
<title>かずとすうじのれんしゅう</title>
<style>
:root{--ink:#2e2a28;--red:#e53935}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;
  background:linear-gradient(180deg,#fffaf0,#fff2cf);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
button{font:inherit;touch-action:manipulation}
.screen{display:none;position:fixed;inset:0;min-height:100dvh}
.screen.active{display:flex}

/* 縦向きガイド */
#orientationScreen{
  z-index:9999;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:30px;
  background:linear-gradient(180deg,#fffaf0,#fff2cf);
}
.rotate-icon{
  font-size:clamp(72px,22vw,150px);
  margin-bottom:18px;
  animation:tilt 1.5s ease-in-out infinite alternate;
}
.rotate-title{
  font-size:clamp(30px,8vw,54px);
  line-height:1.45;
  font-weight:900;
}
@keyframes tilt{
  from{transform:rotate(-10deg)}
  to{transform:rotate(10deg)}
}

/* スタート */
#startScreen{
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:26px;
}
.start-title{
  font-size:clamp(32px,5vw,64px);
  line-height:1.45;
  font-weight:900;
  margin-bottom:42px;
}
.start-btn{
  border:0;
  border-radius:999px;
  padding:20px 58px;
  background:linear-gradient(180deg,#ff9b52,#ff7a2d);
  color:white;
  font-size:clamp(30px,4vw,46px);
  font-weight:900;
  box-shadow:0 8px 0 #d95d18,0 12px 22px rgba(180,90,20,.2);
}
.start-btn:active{
  transform:translateY(5px);
  box-shadow:0 3px 0 #d95d18;
}

/* ゲーム */
#gameScreen{
  flex-direction:column;
  background:#fffdf8;
}
.top-area{
  height:75%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:18px;
}
.timer{
  position:absolute;
  top:12px;
  right:16px;
  background:rgba(255,255,255,.9);
  border-radius:999px;
  padding:7px 14px;
  font-size:clamp(18px,2.5vw,32px);
  font-weight:800;
  color:#776d66;
}
.dots-wrap{
  width:min(92vw,1000px);
  height:min(56vh,470px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:clamp(28px,5vh,58px);
}
.dot-row{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:clamp(28px,6vw,78px);
}
.dot{
  width:clamp(52px,8vw,98px);
  aspect-ratio:1;
  border-radius:50%;
  background:#171717;
  box-shadow:0 5px 0 rgba(0,0,0,.10);
}
.bottom-area{
  height:25%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px 16px 18px;
  background:#fff1cf;
  border-top:4px solid #ffe09a;
}
.number-grid{
  width:min(100%,1050px);
  display:grid;
  grid-template-columns:repeat(9,1fr);
  gap:clamp(5px,1vw,12px);
}
.num-card{
  position:relative;
  border:3px solid #f2c568;
  border-radius:18px;
  background:white;
  min-height:clamp(68px,14vh,120px);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(38px,6.6vw,78px);
  font-weight:900;
  color:#333;
  box-shadow:0 7px 0 rgba(80,60,40,.10);
}
.num-card:active{transform:translateY(3px)}
.feedback{
  pointer-events:none;
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  transform:scale(.4) rotate(-8deg);
  transition:opacity .08s ease,transform .16s cubic-bezier(.2,1.6,.4,1);
  z-index:3;
}
.feedback.show{
  opacity:1;
  transform:scale(1) rotate(-6deg);
}
.feedback svg{width:94%;height:94%;overflow:visible}
.mark-simple{
  font-family:Arial,sans-serif;
  font-weight:900;
  font-size:clamp(70px,11vw,132px);
  color:var(--red);
}

/* 終了 */
#endScreen{
  align-items:center;
  justify-content:space-between;
  flex-direction:column;
  text-align:center;
  padding:clamp(34px,7vh,80px) 24px;
}
.end-label{
  font-size:clamp(28px,5vw,58px);
  font-weight:900;
}
.score{
  font-family:"Arial Rounded MT Bold","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  font-size:clamp(130px,28vw,330px);
  line-height:.9;
  font-weight:900;
  color:#ff7b36;
  text-shadow:0 8px 0 #ffd67c,0 12px 18px rgba(130,70,20,.15);
}
.end-message{
  font-size:clamp(26px,4vw,52px);
  line-height:1.5;
  font-weight:900;
}

@media(max-width:700px){
  .number-grid{gap:4px}
  .num-card{border-width:2px;border-radius:12px;min-height:64px}
  .dot{width:clamp(43px,10vw,68px)}
  .top-area{height:72%}
  .bottom-area{height:28%;padding-left:5px;padding-right:5px}
}
</style>
</head>
<body>

<section id="orientationScreen" class="screen">
  <div class="rotate-icon">📱↻</div>
  <div class="rotate-title">スマートフォンを<br>よこむきにしてね</div>
</section>

<main>
  <section id="startScreen" class="screen active">
    <div class="start-title">●のかずとおなじすうじを、<br>すばやくえらぼう。</div>
    <button id="startBtn" class="start-btn">スタート</button>
  </section>

  <section id="gameScreen" class="screen">
    <div class="top-area">
      <div id="timer" class="timer">1:00</div>
      <div id="dots" class="dots-wrap"></div>
    </div>
    <div class="bottom-area">
      <div id="numberGrid" class="number-grid"></div>
    </div>
  </section>

  <section id="endScreen" class="screen">
    <div class="end-label">きょうのせいかいしたかず</div>
    <div id="score" class="score">0</div>
    <div class="end-message">よくがんばったね。<br>あしたもまってるよ</div>
  </section>
</main>

<script>
(()=>{
const GAME_MS=60000;
const FEEDBACK_MS=320;

const orientationScreen=document.getElementById('orientationScreen');
const startScreen=document.getElementById('startScreen');
const gameScreen=document.getElementById('gameScreen');
const endScreen=document.getElementById('endScreen');
const startBtn=document.getElementById('startBtn');
const dots=document.getElementById('dots');
const grid=document.getElementById('numberGrid');
const timerEl=document.getElementById('timer');
const scoreEl=document.getElementById('score');

let answer=1;
let previousAnswer=null;
let questionShownAt=0;
let gameStartedAt=0;
let timerId=null;
let gameOver=false;
let accepting=false;
let correctCount=0;
let started=false;

function isPortraitPhone(){
  return window.matchMedia('(orientation:portrait) and (max-width:900px)').matches;
}

function showOnly(el){
  [orientationScreen,startScreen,gameScreen,endScreen]
    .forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
}

function refreshOrientation(){
  if(isPortraitPhone()){
    showOnly(orientationScreen);
    accepting=false;
    speechSynthesis?.cancel?.();
  }else{
    if(gameOver) showOnly(endScreen);
    else if(started){
      showOnly(gameScreen);
      questionShownAt=performance.now();
      accepting=true;
    }else{
      showOnly(startScreen);
    }
  }
}

/* 女性らしく聞こえる、高めでやさしい日本語音声を優先 */
function pickJapaneseVoice(){
  if(!('speechSynthesis' in window)) return null;
  const voices=speechSynthesis.getVoices();
  const ja=voices.filter(v=>/^ja[-_]/i.test(v.lang)||/Japanese|日本語/i.test(v.name));
  if(!ja.length) return null;

  const preferred=[
    /Nanami/i,/Haruka/i,/Ayumi/i,/Kyoko/i,
    /Microsoft.*Nanami/i,/Google.*日本語/i,/Google.*Japanese/i
  ];
  for(const p of preferred){
    const found=ja.find(v=>p.test(v.name));
    if(found) return found;
  }
  return ja[0];
}

function utter(text,{rate=.93,pitch=1.18,volume=.95,cancel=true}={}){
  if(!('speechSynthesis' in window)) return;
  if(cancel) speechSynthesis.cancel();

  const u=new SpeechSynthesisUtterance(text);
  u.lang='ja-JP';
  u.rate=rate;
  u.pitch=pitch;
  u.volume=volume;

  const voice=pickJapaneseVoice();
  if(voice) u.voice=voice;
  speechSynthesis.speak(u);
}

/* 語尾を少し高めにして、上向きに聞こえるよう調整 */
function speakIntro(){
  speechSynthesis?.cancel?.();
  utter('丸の数と同じ数字を素早く選ぼう。',{
    rate:.90,pitch:1.12,volume:.92,cancel:false
  });
  utter('スタートボタンを押すと始まるよ。',{
    rate:.92,pitch:1.22,volume:.95,cancel:false
  });
}

function speakWrong(){
  utter('ちがうよ。',{rate:.92,pitch:1.22,volume:.92});
}

function speakExcellent(){
  utter('すんばらしい！',{rate:.97,pitch:1.26,volume:1.0});
}

function speakGreat(){
  utter('やったね！',{rate:.95,pitch:1.24,volume:.98});
}

function speakCorrect(){
  utter('正解！',{rate:.93,pitch:1.18,volume:.95});
}

function speakFinish(){
  speechSynthesis?.cancel?.();
  utter('よくがんばったね。',{
    rate:.88,pitch:1.14,volume:.93,cancel:false
  });
  utter('あしたもまってるよ。',{
    rate:.89,pitch:1.22,volume:.95,cancel:false
  });
}

if('speechSynthesis' in window){
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
}

/* Web Audio 効果音 */
let audioCtx=null;

function ensureAudio(){
  if(!audioCtx){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
}

function chimeSound(){
  ensureAudio();
  const now=audioCtx.currentTime;
  [0,0.09,0.18].forEach((d,i)=>{
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type='sine';
    o.frequency.setValueAtTime([1046.5,1318.5,1568][i],now+d);
    g.gain.setValueAtTime(.0001,now+d);
    g.gain.exponentialRampToValueAtTime(.16,now+d+.01);
    g.gain.exponentialRampToValueAtTime(.0001,now+d+.16);
    o.connect(g).connect(audioCtx.destination);
    o.start(now+d);
    o.stop(now+d+.18);
  });
}

function shakiinSound(){
  ensureAudio();
  const now=audioCtx.currentTime;

  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type='triangle';
  o.frequency.setValueAtTime(1200,now);
  o.frequency.exponentialRampToValueAtTime(3200,now+.24);
  g.gain.setValueAtTime(.0001,now);
  g.gain.exponentialRampToValueAtTime(.20,now+.015);
  g.gain.exponentialRampToValueAtTime(.0001,now+.28);
  o.connect(g).connect(audioCtx.destination);
  o.start(now);
  o.stop(now+.30);

  [2600,3300,4100].forEach((f,i)=>{
    const oo=audioCtx.createOscillator();
    const gg=audioCtx.createGain();
    oo.type='sine';
    oo.frequency.value=f;
    const t=now+.12+i*.045;
    gg.gain.setValueAtTime(.0001,t);
    gg.gain.exponentialRampToValueAtTime(.08,t+.01);
    gg.gain.exponentialRampToValueAtTime(.0001,t+.13);
    oo.connect(gg).connect(audioCtx.destination);
    oo.start(t);
    oo.stop(t+.15);
  });
}

function rand1to9Different(prev){
  let n;
  do n=1+Math.floor(Math.random()*9);
  while(n===prev);
  return n;
}

function renderDots(n){
  dots.innerHTML='';
  const rows=n<=5?[n]:[5,n-5];

  rows.forEach(count=>{
    const row=document.createElement('div');
    row.className='dot-row';

    for(let i=0;i<count;i++){
      const d=document.createElement('div');
      d.className='dot';
      row.appendChild(d);
    }
    dots.appendChild(row);
  });
}

function flowerSvg(){
  let petals='';

  for(let i=0;i<12;i++){
    const a=i*30*Math.PI/180;
    const cx=50+Math.cos(a)*31;
    const cy=50+Math.sin(a)*31;

    petals+=`
      <ellipse
        cx="${cx}" cy="${cy}" rx="12" ry="20"
        transform="rotate(${i*30+90} ${cx} ${cy})"
        fill="none" stroke="#e53935" stroke-width="5.5"
      />`;
  }

  return `
    <svg viewBox="0 0 100 100" aria-hidden="true">
      ${petals}
      <circle cx="50" cy="50" r="25"
        fill="none" stroke="#e53935" stroke-width="6"/>
      <circle cx="50" cy="50" r="15"
        fill="none" stroke="#e53935" stroke-width="5"/>
    </svg>`;
}

function buildCards(){
  grid.innerHTML='';

  for(let n=1;n<=9;n++){
    const b=document.createElement('button');
    b.className='num-card';
    b.innerHTML=`<span>${n}</span><span class="feedback"></span>`;
    b.addEventListener('click',()=>chooseNumber(n,b));
    grid.appendChild(b);
  }
}

function clearFeedback(){
  document.querySelectorAll('.feedback').forEach(f=>{
    f.classList.remove('show');
    f.innerHTML='';
  });
}

function showMark(card,tier){
  const f=card.querySelector('.feedback');

  if(tier===1){
    f.innerHTML=flowerSvg();
  }else if(tier===2){
    f.innerHTML='<span class="mark-simple">◎</span>';
  }else{
    f.innerHTML='<span class="mark-simple">○</span>';
  }

  requestAnimationFrame(()=>f.classList.add('show'));
}

function renderQuestion(){
  if(gameOver||isPortraitPhone()) return;

  clearFeedback();
  answer=rand1to9Different(previousAnswer);
  previousAnswer=answer;
  renderDots(answer);
  questionShownAt=performance.now();
  accepting=true;
}

function chooseNumber(n,card){
  if(!accepting||gameOver||isPortraitPhone()) return;

  if(n!==answer){
    speakWrong();
    return;
  }

  accepting=false;
  correctCount++;

  const elapsed=performance.now()-questionShownAt;
  let tier;

  if(elapsed<1500){
    tier=1;
    shakiinSound();
    speakExcellent();
  }else if(elapsed<3000){
    tier=2;
    chimeSound();
    speakGreat();
  }else{
    tier=3;
    speakCorrect();
  }

  showMark(card,tier);

  /* 音声が流れ始めたら、すぐ次の問題へ */
  setTimeout(()=>{
    if(!gameOver) renderQuestion();
  },FEEDBACK_MS);
}

function updateTimer(){
  if(gameOver) return;

  const elapsed=performance.now()-gameStartedAt;
  const remain=Math.max(0,GAME_MS-elapsed);
  const sec=Math.ceil(remain/1000);

  timerEl.textContent=`0:${String(sec).padStart(2,'0')}`;

  if(remain<=0){
    finishGame();
  }
}

function startGame(){
  if(isPortraitPhone()){
    showOnly(orientationScreen);
    return;
  }

  ensureAudio();
  speechSynthesis?.cancel?.();

  started=true;
  gameOver=false;
  accepting=false;
  correctCount=0;
  previousAnswer=null;
  timerEl.textContent='1:00';

  showOnly(gameScreen);
  buildCards();

  gameStartedAt=performance.now();
  renderQuestion();

  clearInterval(timerId);
  timerId=setInterval(updateTimer,100);
}

function finishGame(){
  if(gameOver) return;

  gameOver=true;
  accepting=false;

  clearInterval(timerId);
  timerId=null;

  speechSynthesis?.cancel?.();

  scoreEl.textContent=correctCount;
  showOnly(endScreen);
  speakFinish();
}

startBtn.addEventListener('click',()=>{
  ensureAudio();
  startGame();
});

window.addEventListener('load',()=>{
  refreshOrientation();

  if(!isPortraitPhone()){
    setTimeout(speakIntro,500);
  }
});

window.addEventListener('resize',refreshOrientation);

window.addEventListener('orientationchange',()=>{
  setTimeout(()=>{
    const wasStart=!started&&!gameOver;
    refreshOrientation();

    if(!isPortraitPhone()&&wasStart){
      setTimeout(speakIntro,300);
    }
  },220);
});

document.addEventListener('pointerdown',()=>{
  if('speechSynthesis' in window){
    speechSynthesis.resume();
  }
  ensureAudio();
},{once:true});

})();
</script>
</body>
</html>
